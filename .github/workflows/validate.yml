name: validate

on:
    pull_request:
    push:
        branches: [main]

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .tool-versions
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run validate
